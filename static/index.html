<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audio8Box</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A8</div>
      <div class="brand-text">
        <div class="brand-name">Audio8Box</div>
        <div class="brand-sub">本地语音合成</div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="synthesize" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4z" />
          <path d="M15.5 8.5a5 5 0 0 1 0 7" />
          <path d="M18.5 5.5a9 9 0 0 1 0 13" />
        </svg>
        <span>合成</span>
      </button>
      <button class="nav-item" data-view="batch" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2" />
          <path d="M4 7h16v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" />
          <path d="M9 12h6" />
        </svg>
        <span>批量合成</span>
      </button>
      <button class="nav-item" data-view="models" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <ellipse cx="12" cy="5" rx="8" ry="3" />
          <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5" />
          <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" />
        </svg>
        <span>模型</span>
        <span id="model-badge" class="nav-badge" hidden></span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="service" id="service">
        <span class="dot"></span>
        <span class="service-text">连接中…</span>
      </div>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1 id="view-title">合成</h1>
      <span class="topbar-meta" id="topbar-meta"></span>
    </header>

    <!-- ===== 合成 ===== -->
    <section class="view active" id="view-synthesize">
      <div class="grid-2">
        <div class="panel">
          <div class="panel-head">
            <h2>文本</h2>
            <span class="hint" id="char-count">0 字</span>
          </div>
          <textarea id="text" placeholder="输入要合成的文字…"></textarea>
          <div class="actions">
            <button class="btn btn-primary" id="synthesize" type="button">合成语音</button>
            <button class="btn btn-ghost" id="clear-text" type="button">清空</button>
          </div>
          <p class="message" id="message" role="status"></p>
          <div class="result" id="result-panel" hidden>
            <audio id="player" controls></audio>
            <div class="result-actions">
              <a class="btn btn-secondary" id="download" href="#" download>下载音频</a>
              <button class="btn btn-ghost" id="reuse" type="button">用作参考音频</button>
            </div>
          </div>
        </div>

        <div class="side">
          <div class="panel">
            <div class="panel-head"><h2>采样参数</h2></div>
            <div class="field-grid">
              <label>temperature
                <input id="temperature" type="number" step="0.05" min="0" max="2" value="0.7" />
              </label>
              <label>top_p
                <input id="top_p" type="number" step="0.05" min="0" max="1" value="0.9" />
              </label>
              <label>top_k
                <input id="top_k" type="number" step="1" min="1" max="200" value="50" />
              </label>
              <label>格式
                <select id="format">
                  <option value="wav" selected>WAV</option>
                  <option value="flac">FLAC</option>
                  <option value="ogg">OGG</option>
                  <option value="mp3">MP3</option>
                </select>
              </label>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h2>音色克隆</h2>
              <span class="tag">可选</span>
            </div>
            <label class="field">
              <span>已保存音色</span>
              <select id="voice-select"></select>
            </label>
            <div class="voice-actions">
              <button class="btn btn-ghost btn-sm" id="voice-save" type="button">存为音色</button>
              <button class="btn btn-ghost btn-sm" id="voice-delete" type="button">删除音色</button>
            </div>
            <label class="field">
              <span>参考音频</span>
              <input id="ref_audio" type="file" accept="audio/*" />
            </label>
            <label class="field">
              <span>参考文本</span>
              <input id="ref_text" type="text" placeholder="参考音频所说的准确文字" />
            </label>
            <p class="hint" id="voice-hint"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 批量合成 ===== -->
    <section class="view" id="view-batch">
      <div class="panel">
        <div class="panel-head">
          <h2>批量文本</h2>
          <span class="hint">上传 .txt 或粘贴文本，按句拆分后逐句合成</span>
        </div>
        <textarea id="batch-text" placeholder="粘贴多句文本，或上传 .txt 文件…"></textarea>
        <div class="batch-bar">
          <input type="file" id="batch-file" accept=".txt,text/plain" hidden />
          <button class="btn btn-ghost btn-sm" id="batch-upload" type="button">选择 .txt 文件</button>
          <span class="hint" id="batch-file-name">未选择文件</span>
        </div>
        <div class="batch-ref">
          <label>
            <span>已保存音色</span>
            <select id="batch-voice-select"></select>
          </label>
          <label>
            <span>参考音频（可选）</span>
            <input id="batch-ref-audio" type="file" accept="audio/*" />
          </label>
          <label>
            <span>参考文本</span>
            <input id="batch-ref-text" type="text" placeholder="参考音频所说的准确文字" />
          </label>
        </div>
        <div class="batch-params">
          <label>格式
            <select id="batch-format">
              <option value="wav" selected>WAV</option>
              <option value="flac">FLAC</option>
              <option value="ogg">OGG</option>
              <option value="mp3">MP3</option>
            </select>
          </label>
          <label>temperature
            <input id="batch-temperature" type="number" step="0.05" min="0" max="2" value="0.7" />
          </label>
          <label>top_p
            <input id="batch-top-p" type="number" step="0.05" min="0" max="1" value="0.9" />
          </label>
          <label>top_k
            <input id="batch-top-k" type="number" step="1" min="1" max="200" value="50" />
          </label>
          <button class="btn btn-primary" id="batch-start" type="button">开始合成</button>
        </div>
        <p class="message" id="batch-message" role="status"></p>
      </div>

      <div class="panel" id="batch-progress-panel" hidden>
        <div class="panel-head">
          <h2>合成进度</h2>
          <span class="hint" id="batch-progress-text">0 / 0</span>
        </div>
        <div class="progress"><div class="progress-bar" id="batch-bar"></div></div>
        <div class="batch-current" id="batch-current"></div>
        <div class="actions" id="batch-result-actions" hidden>
          <a class="btn btn-primary" id="batch-download" href="#">下载 ZIP</a>
          <button class="btn btn-ghost" id="batch-reset" type="button">新建任务</button>
        </div>
      </div>

      <div class="panel" id="batch-sentences-panel" hidden>
        <div class="panel-head">
          <h2>句子清单</h2>
          <span class="hint" id="batch-count"></span>
        </div>
        <div class="sentence-list" id="sentence-list"></div>
      </div>
    </section>

    <!-- ===== 模型 ===== -->
    <section class="view" id="view-models">
      <div class="stats" id="model-stats"></div>
      <div class="panel">
        <div class="model-table" id="model-table"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal">
    <h3 id="modal-title">确认</h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel" type="button">取消</button>
      <button class="btn btn-danger" id="modal-confirm" type="button">确认删除</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="/app.js"></script>
</body>
</html>
