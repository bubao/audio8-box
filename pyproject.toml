[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio8box"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "huggingface-hub>=0.30",
  "soundfile>=0.13",
  "python-multipart>=0.0.9",
  "mlx-audio>=0.4.7; sys_platform == 'darwin'",
  "modelscope>=1.40.3",
]

[project.optional-dependencies]
pytorch = [
  "torch>=2.5",
  "torchaudio>=2.5",
  "transformers>=4.57",
]

[tool.setuptools]
py-modules = ["audio8_service", "models", "server", "text_utils", "voices"]
